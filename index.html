        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-card {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FullCalendar Dark Theme */
        .fc {
            --fc-border-color: rgba(255, 255, 255, 0.1);
            --fc-page-bg-color: transparent;
            --fc-neutral-bg-color: rgba(255, 255, 255, 0.05);
            --fc-list-event-hover-bg-color: rgba(255, 255, 255, 0.1);
        }
        .fc .fc-toolbar-title { color: #ffffff; font-size: 1.25rem; font-weight: bold; }
        .fc .fc-button-primary { background-color: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.1); color: #fff; border-radius: 0.75rem; text-transform: capitalize; }
        .fc .fc-button-primary:hover { background-color: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.2); }
        .fc .fc-button-primary:not(:disabled).fc-button-active { background-color: #b3c7f9; border-color: #b3c7f9; color: #000; font-weight: bold; }
        .fc .fc-daygrid-day-number { color: #ccc; text-decoration: none; font-size: 0.85rem; }
        .fc .fc-col-header-cell-cushion { color: #888; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>

                        nameAttr: 'data-lucide',
                        attrs: { class: className },
                        el: spanRef.current

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('myTasks_v2');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: 'Stand up', completed: true, category: 'work' },
                    { id: 2, text: 'English lesson', completed: false, category: 'education' },
                    { id: 3, text: 'Work out', completed: false, category: 'health' },
                    { id: 4, text: 'Prepare ABC Project', completed: false, category: 'work' }
                ];
            });
            const [notes, setNotes] = useState(() => {
                const saved = localStorage.getItem('myNotes');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'Idées de projet', content: 'Repenser le design du portfolio...', date: '2026-11-02' }
                ];
            });
            const [bookmarks, setBookmarks] = useState(() => {
                const saved = localStorage.getItem('myBookmarks');

                    { id: 1, name: 'Dribbble', url: 'https://dribbble.com' },
                    { id: 2, name: 'GitHub', url: 'https://github.com' }
                ];
            });

                const saved = localStorage.getItem('myEvents');
                return saved ? JSON.parse(saved) : [];
            });

                const saved = localStorage.getItem('myWatchlist');

                    <div className="grid grid-cols-1 md:grid-cols-12 gap-8 fade-in">
                        <div className="md:col-span-3 flex flex-col gap-6">

                            </div>
                        </div>
                        <div className="md:col-span-5 flex flex-col gap-6">
                            <div className="bg-[#ffcda3] text-black p-8 rounded-[2rem] shadow-xl relative overflow-hidden h-full">
                                <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-2xl">Aujourd'hui</h3><div className="flex items-center gap-2"><span className="text-sm font-medium bg-black/10 px-3 py-1 rounded-full">{completedCount}/{tasks.length}</span></div></div>

                                    {tasks.map(task => (
                                        <div key={task.id} className="flex items-center justify-between group cursor-pointer p-2 hover:bg-black/5 rounded-lg transition" onClick={() => toggleTask(task.id)}>

                                                <div className={`w-6 h-6 rounded-full border-[2px] flex items-center justify-center transition-colors ${task.completed ? 'border-black bg-black' : 'border-black/50 group-hover:border-black'}`}>{task.completed && <Icon name="check" className="w-4 h-4 text-[#ffcda3]" />}</div>

                                            </div>

                            </div>
                        </div>

                                                <div className="flex items-center gap-2"><Icon name="check-circle-2" className="w-4 h-4" /> {ev.title}</div>
                                            </div>
                                        </div>

                                        <p className="text-sm">Aucun événement prévu aujourd'hui</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const TasksView = () => {
                const [newTask, setNewTask] = useState("");
                const addTask = (e) => {
                    if (e.key === 'Enter' && newTask.trim() !== '') { setTasks([...tasks, { id: Date.now(), text: newTask, completed: false, category: 'general' }]); setNewTask(""); }

                                { title: "Le Roi du Game", rating: 3.2, comment: "Comédie · Eric Judor · Sortie le 21/10/2026", image: 'https://fr.web.img6.acsta.net/c_320_426/img/21/11/211184243b4ab7c37127ace9ced2e939.jpg' },
                                { title: "Street Fighter", rating: 2.4, comment: "Action · Kitao Sakurai · Sortie le 14/10/2026", image: 'https://fr.web.img3.acsta.net/c_320_426/img/fc/20/fc20187ddbbd4af991999e32c9a03fb4.jpg' },
                                { title: "Heart Of The Beast", rating: 3.8, comment: "Action aventure · David Ayer · Sortie le 23/09/2026", image: 'https://fr.web.img3.acsta.net/c_320_426/img/6f/af/6faf7d9aa879bd9374e773f31db44956.jpg' },
                                { title: "Mochy", rating: 3.2, comment: "Animation · Jérémie Degruson, Yanis Belaid · Sortie le 14/10/2026", image: 'https://fr.web.img5.acsta.net/c_320_426/img/2e/29/2e292d36aa0d7fc0efb2e1d08578357d.jpg' },
                                { title: "Ducobu et le fantôme de Saint-Potache", rating: 2.3, comment: "Comédie famille · Elie Semoun · Sortie le 07/10/2026", image: 'https://fr.web.img6.acsta.net/c_320_426/img/54/16/54167f9b523fff67b07b2e80f5f9dd71.jpg' },
                                { title: "Une femme aujourd'hui", rating: 3.7, comment: "Comédie dramatique · Robert Guédiguian · Sortie le 21/10/2026", image: 'https://fr.web.img3.acsta.net/c_320_426/img/92/7f/927fd5891c142dc643f5851ba85d8393.jpg' }
                            ];
                            const actualitesIMDb = kinepolisFilms.map((film, index) => ({
                                id: 'kinepolis-' + (index + 1),
                                title: film.title,
                                type: 'Actualité',
                                category: 'film',
                                rating: film.rating,
                                comment: film.comment,
                                image: film.image || kinepolisPosters[index % kinepolisPosters.length],
                                date: '2026-11-03'
                            }));

                            // Animés de la saison Automne 2026 (source : API AniList, triés par popularité)
                            // Les notes sont les scores AniList (/100) ramenés sur 5
                            const anilistAnimes = [
                                { title: "Cyberpunk: Edgerunners 2", rating: 4.2, comment: "Action, Sci-Fi · TRIGGER · 10 épisodes · Saison terminée", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx195539-4LdfmKIHzuxr.png' },
                                { title: "Black Clover Season 2", rating: 4.4, comment: "Action, Fantasy · Studio Pierrot · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx195604-tSZcfKbVqSEG.jpg' },
                                { title: "STEEL BALL RUN JoJo's Bizarre Adventure 2nd - 3rd STAGE", rating: 4.3, comment: "Action, Aventure · david production · 11 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx210482-P1VNKbqdJ6Zj.jpg' },
                                { title: "The Apothecary Diaries Season 3", rating: 4.3, comment: "Drama, Mystery · OLM · 12 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx195516-MJpUZlOberqH.jpg' },
                                { title: "Blue Box Season 2", rating: 4.1, comment: "Romance, Sport · Electric Circus · 12 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx189123-0secXELIhkIW.jpg' },
                                { title: "The Ramparts of Ice Season 2", rating: 4.1, comment: "Comédie, Romance · Studio KAI · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx213805-Nokui3uWlIlw.png' },
                                { title: "Made in Abyss: Mezameru Shinpi", rating: 4.0, comment: "Aventure, Fantasy · Kinema Citrus · Film · Sorti", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx160275-cBOWJpcCGeMq.jpg' },
                                { title: "Overgeared", rating: 3.8, comment: "Action, Fantasy · J.C.STAFF · 12 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx212888-NhyvqPt5aIuJ.jpg' },
                                { title: "Reincarnated as a Sword Season 2", rating: 3.8, comment: "Action, Fantasy · C2C · 12 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx159042-GGFwlDskc5vR.png' },
                                { title: "Firefly Wedding", rating: 3.8, comment: "Drama, Romance · david production · 12 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx205909-DM0fAzNQulod.jpg' },
                                { title: "Even the Student Council Has Its Holes!", rating: 3.7, comment: "Comédie, Slice of Life · Passione · 12 épisodes · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx191656-xFHtxM8SUTdU.png' },
                                { title: "The Laid-Off Cheat-Granting Mage Enjoys a Second Lease on Life", rating: 3.7, comment: "Aventure, Fantasy · P.A.WORKS · En diffusion", image: 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/b207329-6VPeZIDfF4Sr.png' }
                            ];
                            const actualitesAnimes = anilistAnimes.map((anime, index) => ({
                                id: 'anime-' + (index + 1),
                                title: anime.title,
                                type: 'Actualité',
                                category: 'anime',
                                rating: anime.rating,
                                comment: anime.comment,
                                image: anime.image,
                                date: '2026-11-03'
                            }));
                            const actualitesProgrammation = [...actualitesIMDb, ...actualitesAnimes];
                            actualitesRef.current = actualitesProgrammation;

                            // Synchronisation une seule fois par chargement de page : sinon le remontage
                            // de la vue annulerait aussitôt toute suppression faite par l'utilisateur
                            if (!watchlistSynced) {
                                watchlistSynced = true;
                                setWatchlist(prev => {
                                    const legacyIds = ['act-1', 'act-2', 'act-3'];
                                    const isProg = id => /^(kinepolis|anime)-/.test(String(id));
                                    const cleaned = prev.filter(item => !legacyIds.includes(item.id));
                                    const known = new Set(cleaned.map(item => item.id));
                                    // Ajoute ce qui manque (premier chargement, ou nouveaux animés) sans
                                    // réinsérer ce que l'utilisateur a supprimé volontairement
                                    const manquants = actualitesProgrammation.filter(a => !known.has(a.id));
                                    // Met à jour les affiches obsolètes des entrées conservées
                                    const fixed = cleaned.map(item => {
                                        const ref = isProg(item.id) ? actualitesProgrammation.find(a => a.id === item.id) : null;
                                        return ref && item.image !== ref.image ? { ...item, image: ref.image } : item;
                                    });
                                    const changed = fixed.some((item, index) => item !== cleaned[index]);
                                    if (!manquants.length && !changed && cleaned.length === prev.length) return prev;
                                    return [...manquants, ...fixed];
                                });
                            }

                            // OMDb ne sert qu'aux suggestions : une panne réseau ne doit pas bloquer les actualités
                            let data = null;
                            try {
                                const res = await fetch('https://www.omdbapi.com/?apikey=trilogy&s=2026&type=movie');
                                data = await res.json();
                            } catch (err) {
                                console.warn("OMDb indisponible - programmation Kinepolis chargée seule.", err);
                            }

                            let popular = [];
                            if (data && data.Search) {
                                popular = data.Search.slice(0, 5).map(item => ({
                                    id: 'omdb-' + item.imdbID,
                                    title: item.Title,
                                    type: 'Film',
                                    rating: 4.5,
                                    comment: `Sortie en ${item.Year} - Retrouvé sur IMDb`,
                                    image: item.Poster !== 'N/A' ? item.Poster : ''
                                }));
                            }

                            // Nettoie les anciennes actualités codées en dur (Avengers, Avatar, Batman)
                            // puis synchronise la programmation Kinepolis Béziers dans la watchlist
                            setApiResults(popular);
                        } catch (err) {
                            console.error("Erreur chargement OMDb:", err);
                        } finally {
                            setIsSearchingApi(false);
                        }
                    };
                    fetchDefaultMovies();
                }, []);

                const handleSearchInternet = async (e) => {
                    e.preventDefault();
                    if (!searchQuery.trim()) return;
                    setIsSearchingApi(true);
                    setApiResults([]);

                    try {
                        const res = await fetch(`https://www.omdbapi.com/?apikey=trilogy&s=${encodeURIComponent(searchQuery)}`);
                        const data = await res.json();

                        if (data && data.Search) {
                            const results = data.Search.slice(0, 8).map(item => ({
                                id: 'omdb-' + item.imdbID,
                                title: item.Title,
                                type: item.Type === 'series' ? 'Série' : 'Film',
                                rating: 4,
                                comment: `Année : ${item.Year}`,
                                image: item.Poster !== 'N/A' ? item.Poster : ''
                            }));
                            setApiResults(results);
                        } else {
                            setApiResults([]);
                        }
                    } catch (err) {
                        console.error("Erreur recherche OMDb:", err);
                    } finally {
                        setIsSearchingApi(false);
                    }
                };

                const selectSearchResult = (item) => {
                    setTitle(item.title);
                    setType(item.type);
                    setRating(item.rating);
                    setComment(item.comment);
                    setImage(item.image);
                };

                const openAddModal = () => {
                    setEditingId(null);
                    setTitle('');
                    setType('Film');
                    setRating(5);
                    setStatus('en-attente');
                    setComment('');
                    setImage('');
                    setApiResults([]);
                    setSearchQuery('');
                    setShowModal(true);
                };

                const openEditModal = (item) => {
                    setEditingId(item.id);
                    setTitle(item.title);
                    setType(item.type);
                    setRating(item.rating);
                    setComment(item.comment || '');
                    setImage(item.image || '');
                    setStatus(item.status || 'en-attente');
                    setApiResults([]);
                    setSearchQuery('');
                    setShowModal(true);
                };

                const handleSaveMedia = (e) => {
                    e.preventDefault();
                    if (!title.trim()) return;
                    const defaultImgs = {
                        'Film': 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80',
                        'Série': 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80',
                        'Anime': 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80',
                        'Actualité': 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80'
                    };
                    const finalImage = image.trim() || defaultImgs[type] || defaultImgs['Film'];

                    if (editingId) {
                        // Mode édition
                        setWatchlist(watchlist.map(w => w.id === editingId ? {
                            ...w,
                            title: title.trim(),
                            type,
                            rating: Number(rating),
                            comment: comment.trim(),
                            image: finalImage,
                            status
                        } : w));
                    } else {
                        // Mode ajout
                        const newItem = {
                            id: Date.now(),
                            title: title.trim(),
                            type,
                            rating: Number(rating),
                            comment: comment.trim(),
                            image: finalImage,
                            date: new Date().toLocaleDateString(),
                            status
                        };
                        setWatchlist([newItem, ...watchlist]);
                    }

                    setTitle(''); setComment(''); setImage(''); setEditingId(null);
                    setShowModal(false);
                };

                const handleDelete = (id) => {
                    setWatchlist(watchlist.filter(w => w.id !== id));
                };

                // Une actualité ne se modifie pas : on la copie dans la liste personnelle en
                // choisissant son statut (ou on met à jour le statut si elle y est déjà)
                const openQuickAdd = (item) => {
                    const existing = watchlist.find(w => w.type !== 'Actualité' && w.title === item.title);
                    // La note de base vient de l'actualité (AlloCiné / AniList) : ma note personnelle
                    // s'ajoute en dessous, pré-remplie avec elle (ou avec la note déjà saisie)
                    const noteBase = Number(item.rating) || 0;
                    const maNote = existing && typeof existing.myRating === 'number' ? existing.myRating : noteBase;
                    setQuickAdd({ item, existingId: existing ? existing.id : null, myRating: maNote });
                };

                const confirmQuickAdd = (statusChoisi) => {
                    if (!quickAdd) return;
                    const { item, existingId } = quickAdd;
                    const maNote = Number(quickAdd.myRating);
                    const notePerso = Number.isFinite(maNote) ? maNote : Number(item.rating) || 0;
                    if (existingId) {
                        setWatchlist(prev => prev.map(w => w.id === existingId ? { ...w, status: statusChoisi, myRating: notePerso } : w));
                    } else {
                        setWatchlist(prev => [{
                            id: 'copie-' + Date.now(),
                            title: item.title,
                            type: item.category === 'anime' ? 'Anime' : 'Film',
                            rating: item.rating,
                            myRating: notePerso,
                            comment: item.comment,
                            image: item.image,
                            date: new Date().toLocaleDateString('fr-FR'),
                            status: statusChoisi
                        }, ...prev]);
                    }
                    setQuickAdd(null);
                };

                // Même principe que « Actualiser Red Bull » dans Événements : recharge la programmation
                // embarquée (films supprimés restaurés, affiches resynchronisées) avec un état de chargement
                const handleRefreshActualites = () => {
                    if (isRefreshing) return;
                    setIsRefreshing(true);
                    setTimeout(() => {
                        const actualites = actualitesRef.current;
                        if (actualites.length) {
                            setWatchlist(prev => {
                                const isProg = item => /^(kinepolis|anime)-/.test(String(item.id));
                                return [...actualites, ...prev.filter(item => !isProg(item))];
                            });
                        }
                        lastRefreshLabel = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                        setLastRefresh(lastRefreshLabel);
                        setIsRefreshing(false);
                    }, 700);
                };

                const filtered = selectedType === 'all' 
                    ? watchlist 
                    : watchlist.filter(w => w.type.toLowerCase() === selectedType.toLowerCase());

                // Filtre secondaire de l'onglet Actualités : films du Kinepolis ou animés de la saison
                // (les anciennes entrées sans catégorie sont considérées comme des films)
                const visible = selectedType === 'Actualité'
                    ? filtered.filter(w => (w.category || 'film') === actCategory)
                    : filtered;

                return (
                    <div className="fade-in flex flex-col gap-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div className="flex flex-wrap gap-2 bg-white/5 p-1.5 rounded-2xl border border-white/10">
                                {[
                                    { id: 'all', label: 'Tous' },
                                    { id: 'Film', label: '🎬 Films' },
                                    { id: 'Série', label: '📺 Séries' },
                                    { id: 'Anime', label: '⚔️ Animes' },
                                    { id: 'Actualité', label: '📰 Actualités' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setSelectedType(tab.id)}
                                        className={`px-4 py-2 rounded-xl text-sm font-medium transition ${selectedType === tab.id ? 'bg-[#d8b4fe] text-black font-bold' : 'text-gray-400 hover:text-white'}`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                            <div className="flex flex-col items-start sm:items-end gap-1">
                                <div className="flex flex-wrap items-center gap-3">
                                    <button
                                        onClick={handleRefreshActualites}
                                        disabled={isRefreshing}
                                        title="Recharger la programmation du Kinepolis Béziers"
                                        className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-lg hover:scale-105 text-sm disabled:opacity-50 disabled:hover:scale-100"
                                    >
                                        <svg className={`w-4 h-4 ${isRefreshing ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
                                        {isRefreshing ? 'Actualisation...' : 'Actualiser les films'}
                                    </button>
                                    <button
                                        onClick={openAddModal}
                                        className="bg-[#d8b4fe] hover:bg-[#c084fc] text-black font-bold px-5 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-lg hover:scale-105 text-sm"
                                    >
                                        <Icon name="plus" className="w-4 h-4" /> Ajouter une œuvre
                                    </button>
                                </div>
                                {lastRefresh && <span className="text-[11px] text-gray-500">Dernière actualisation : {lastRefresh}</span>}
                            </div>
                        </div>

                        {selectedType === 'Actualité' && (
                            <div className="flex flex-wrap items-center gap-2">
                                <span className="text-xs text-gray-500 mr-1">Afficher :</span>
                                {[
                                    { id: 'film', label: '🎬 Films cinéma' },
                                    { id: 'anime', label: '⚔️ Animés' }
                                ].map(f => {
                                    const total = watchlist.filter(w => w.type === 'Actualité' && (w.category || 'film') === f.id).length;
                                    return (
                                        <button
                                            key={f.id}
                                            onClick={() => changeActCategory(f.id)}
                                            className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition border ${actCategory === f.id ? 'bg-white/15 text-white border-white/25' : 'text-gray-400 border-white/10 hover:text-white hover:bg-white/5'}`}
                                        >
                                            {f.label} <span className="ml-1 text-[10px] opacity-70">({total})</span>
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        {showModal && (
                            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="glass-card bg-[#1a1a1a] p-6 rounded-3xl w-full max-w-xl border border-purple-500/30 text-white max-h-[90vh] overflow-y-auto">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-xl font-bold flex items-center gap-2">
                                            <span className="text-purple-400">🎬</span> {editingId ? "Modifier l'œuvre" : "Ajouter un Film / Série"}
                                        </h3>
                                        <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                                    </div>

                                    {!editingId && (
                                        <form onSubmit={handleSearchInternet} className="mb-6 bg-white/5 p-4 rounded-2xl border border-white/10">
                                            <label className="text-xs text-purple-300 font-bold block mb-2">Rechercher sur la base de données OMDb</label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={searchQuery}
                                                    onChange={e => setSearchQuery(e.target.value)}
                                                    placeholder="Ex: Batman, Matrix, Star Wars..."
                                                    className="flex-1 bg-black/30 border border-white/10 p-2.5 rounded-xl outline-none focus:border-purple-400 text-sm"
                                                />
                                                <button type="submit" disabled={isSearchingApi} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-1.5">
                                                    <Icon name={isSearchingApi ? "loader-2" : "search"} className={`w-4 h-4 ${isSearchingApi ? "animate-spin" : ""}`} />
                                                    Rechercher
                                                </button>
                                            </div>

                                            <div className="mt-4 flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                                                {apiResults.map(res => (
                                                    <div
                                                        key={res.id}
                                                        onClick={() => selectSearchResult(res)}
                                                        className="flex items-center gap-3 p-2 bg-white/5 hover:bg-purple-500/20 rounded-xl cursor-pointer transition border border-white/5"
                                                    >
                                                        {res.image ? (
                                                            <img src={res.image} alt={res.title} className="w-10 h-12 object-cover rounded-md" />
                                                        ) : (
                                                            <div className="w-10 h-12 bg-purple-900/50 rounded-md flex items-center justify-center text-xs font-bold text-purple-300">OMDb</div>
                                                        )}
                                                        <div className="flex-1 overflow-hidden">
                                                            <div className="font-bold text-sm truncate">{res.title}</div>
                                                            <div className="text-xs text-gray-400">{res.type} • {res.comment}</div>
                                                        </div>
                                                        <span className="text-xs bg-purple-500/30 text-purple-200 px-2.5 py-1 rounded-lg">Sélectionner</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </form>
                                    )}

                                    <form onSubmit={handleSaveMedia} className="flex flex-col gap-4">
                                        <div>
                                            <label className="text-xs text-gray-400 block mb-1">Titre *</label>
                                            <input type="text" required value={title} onChange={e => setTitle(e.target.value)} placeholder="Nom du film ou de la série..." className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-purple-400 text-sm" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-xs text-gray-400 block mb-1">Type</label>
                                                <select value={type} onChange={e => setType(e.target.value)} className="w-full bg-[#242424] border border-white/10 p-3 rounded-xl outline-none focus:border-purple-400 text-sm text-white">
                                                    <option value="Film">🎬 Film</option>
                                                    <option value="Série">📺 Série</option>
                                                    <option value="Anime">⚔️ Anime</option>
                                                    <option value="Actualité">📰 Actualité (IMDb Calendar)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 block mb-1">Note ({rating}/5)</label>
                                                <input type="range" min="1" max="5" step="0.5" value={rating} onChange={e => setRating(e.target.value)} className="w-full accent-purple-400 mt-2" />
                                            </div>
                                        </div>
                                        {type !== 'Actualité' && (
                                            <div>
                                                <label className="text-xs text-gray-400 block mb-1">Statut</label>
                                                <select value={status} onChange={e => setStatus(e.target.value)} className="w-full bg-[#242424] border border-white/10 p-3 rounded-xl outline-none focus:border-purple-400 text-sm text-white">
                                                    {WATCH_STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                                                </select>
                                            </div>
                                        )}
                                        <div>
                                            <label className="text-xs text-gray-400 block mb-1">Avis / Commentaire</label>
                                            <textarea value={comment} onChange={e => setComment(e.target.value)} placeholder="Votre avis personnel..." className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-purple-400 text-sm min-h-[80px]"></textarea>
                                        </div>
                                        <div className="flex gap-3 mt-2">
                                            <button type="button" onClick={() => setShowModal(false)} className="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 text-sm">Annuler</button>
                                            <button type="submit" className="flex-1 py-3 rounded-xl bg-purple-600 hover:bg-purple-500 font-bold text-white text-sm">
                                                {editingId ? "Mettre à jour" : "Enregistrer"}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {quickAdd && (
                            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setQuickAdd(null)}>
                                <div className="glass-card bg-[#1a1a1a] p-6 rounded-3xl w-full max-w-md border border-purple-500/30 text-white shadow-2xl" onClick={e => e.stopPropagation()}>
                                    <div className="flex justify-between items-start gap-4">
                                        <div>
                                            <h3 className="text-lg font-extrabold leading-tight">{quickAdd.item.title}</h3>
                                            <p className="text-xs text-gray-400 mt-1">
                                                {quickAdd.existingId ? 'Déjà dans votre liste — statut et note' : 'Ajouter à votre liste : statut et note'}
                                            </p>
                                        </div>
                                        <button onClick={() => setQuickAdd(null)} className="text-gray-400 hover:text-white shrink-0"><Icon name="x" className="w-5 h-5" /></button>
                                    </div>
                                    <div className="mt-4 bg-white/5 border border-white/10 rounded-2xl p-4">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs text-gray-400">Note de base</span>
                                            <span className="text-amber-400 font-bold text-sm">★ {quickAdd.item.rating}/5</span>
                                        </div>
                                        <div className="mt-3">
                                            <label className="text-xs text-purple-300 font-bold block mb-1">Ma note ({quickAdd.myRating}/5)</label>
                                            <input
                                                type="range"
                                                min="1"
                                                max="5"
                                                step="0.5"
                                                value={quickAdd.myRating}
                                                onChange={e => setQuickAdd(q => q ? { ...q, myRating: Number(e.target.value) } : q)}
                                                className="w-full accent-purple-400 mt-1"
                                            />
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-2 mt-5">
                                        {WATCH_STATUSES.map(s => (
                                            <button
                                                key={s.id}
                                                onClick={() => confirmQuickAdd(s.id)}
                                                className={`flex items-center justify-between px-4 py-3 rounded-xl text-sm font-extrabold text-white border border-white/10 hover:border-white/40 hover:scale-[1.01] transition ${s.cls}`}
                                            >
                                                <span>{s.label}</span>
                                                <Icon name="arrow-right" className="w-4 h-4 opacity-70" />
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {visible.length === 0 ? (
                            <div className="glass-card p-16 rounded-3xl text-center my-6 flex flex-col items-center justify-center gap-4 border border-dashed border-white/10">
                                <Icon name="film" className="w-12 h-12 text-purple-400 opacity-50" />
                                <h3 className="text-xl font-bold text-white">Aucune œuvre enregistrée</h3>
                                <p className="text-gray-400 text-sm max-w-md">Ajoutez vos films et séries depuis l'API OMDb !</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {visible.map(item => (
                                    <div
                                        key={item.id}
                                        onClick={item.type === 'Actualité' ? () => openQuickAdd(item) : undefined}
                                        className={`glass-card rounded-3xl overflow-hidden flex flex-col justify-between hover:border-purple-500/40 transition duration-300 group shadow-lg ${item.type === 'Actualité' ? 'cursor-pointer hover:border-purple-400/60' : ''}`}
                                    >
                                        <div>
                                            <div className="relative h-64 overflow-hidden bg-neutral-900">
                                                <img src={item.image} alt={item.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" onError={(e) => { e.target.onerror = null; e.target.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80'; }} />
                                                {item.type === 'Actualité' && (
                                                    <div className="absolute inset-0 bg-black/55 opacity-0 group-hover:opacity-100 transition flex items-center justify-center px-4">
                                                        <span className="px-4 py-2 rounded-full bg-purple-600 text-white text-xs font-extrabold flex items-center gap-2 shadow-lg text-center">
                                                            <Icon name="plus" className="w-4 h-4 shrink-0" />
                                                            {watchlist.some(w => w.type !== 'Actualité' && w.title === item.title) ? 'Déjà dans ma liste — changer le statut' : 'Ajouter à ma liste'}
                                                        </span>
                                                    </div>
                                                )}
                                                <div className="absolute top-3 left-3 flex flex-wrap gap-2">
                                                <span className="px-3 py-1 rounded-full text-xs font-extrabold bg-black/60 text-white backdrop-blur-md">
                                                        {item.type === 'Film' ? '🎬 Film' : item.type === 'Série' ? '📺 Série' : item.type === 'Anime' ? '⚔️ Anime' : '📰 Actualité'}
                                                    </span>
                                                    {item.status && watchStatus(item.status) && (
                                                        <span className={`px-2.5 py-1 rounded-full text-[11px] font-extrabold text-white backdrop-blur-md ${watchStatus(item.status).cls}`}>
                                                            {watchStatus(item.status).label}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="absolute top-3 right-3 flex flex-col items-end gap-2">
                                                    <div className="bg-black/70 backdrop-blur-md px-3 py-1 rounded-full text-amber-400 font-bold text-xs flex items-center gap-1">
                                                        ★ {item.rating}/5
                                                    </div>
                                                    {typeof item.myRating === 'number' && (
                                                        <div className="bg-black/70 backdrop-blur-md px-3 py-1 rounded-full text-[#d8b4fe] font-bold text-xs flex items-center gap-1" title="Ma note personnelle">
                                                            ★ Ma note : {item.myRating}/5
                                                        </div>
                                                    )}
                                                </div>
                                                {item.type !== 'Actualité' && (
                                                    <div className="absolute bottom-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition">
                                                        <button onClick={(e) => { e.stopPropagation(); openEditModal(item); }} className="w-8 h-8 rounded-full bg-black/70 hover:bg-purple-600 text-white flex items-center justify-center backdrop-blur-md transition" title="Modifier">
                                                            <Icon name="edit-2" className="w-4 h-4" />
                                                        </button>
                                                        <button onClick={(e) => { e.stopPropagation(); handleDelete(item.id); }} className="w-8 h-8 rounded-full bg-black/70 hover:bg-red-600 text-white flex items-center justify-center backdrop-blur-md transition" title="Supprimer">
                                                            <Icon name="trash-2" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="p-6">
                                                <h3 className="font-bold text-xl text-white mb-2">{item.title}</h3>
                                                {item.comment && <p className="text-gray-300 text-xs mb-4 line-clamp-3 italic">"{item.comment}"</p>}
                                                <div className="text-gray-500 text-[11px]">Ajouté le {item.date || 'Récemment'}</div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            const BookmarksView = () => {
                const [newName, setNewName] = useState("");
                const [newUrl, setNewUrl] = useState("");
                const addBookmark = (e) => {
                    e.preventDefault();
                    if(newName && newUrl) {
                        let formattedUrl = newUrl.startsWith('http') ? newUrl : `https://${newUrl}`;
                        setBookmarks([...bookmarks, { id: Date.now(), name: newName, url: formattedUrl }]);
                        setNewName(""); setNewUrl("");
                    }
                };
                const deleteBookmark = (id) => setBookmarks(bookmarks.filter(b => b.id !== id));
                return (
                    <div className="fade-in">
                        <form onSubmit={addBookmark} className="glass-card p-6 rounded-3xl flex gap-4 mb-8 items-end max-w-2xl">
                            <div className="flex-1">
                                <label className="text-sm text-gray-400 mb-1 block">Nom du site</label>
                                <input required type="text" value={newName} onChange={e=>setNewName(e.target.value)} className="w-full bg-white/5 border border-white/10 p-3 rounded-lg outline-none focus:border-[#b3c7f9]" placeholder="Ex: GitHub" />
                            </div>
                            <div className="flex-1">
                                <label className="text-sm text-gray-400 mb-1 block">URL</label>
                                <input required type="text" value={newUrl} onChange={e=>setNewUrl(e.target.value)} className="w-full bg-white/5 border border-white/10 p-3 rounded-lg outline-none focus:border-[#b3c7f9]" placeholder="Ex: github.com" />
                            </div>
                            <button type="submit" className="bg-[#b3c7f9] text-black font-bold px-6 py-3 rounded-lg hover:opacity-90 transition h-[46px]"><Icon name="plus" className="w-5 h-5" /></button>
                        </form>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                            {bookmarks.map(bm => (
                                <a key={bm.id} href={bm.url} target="_blank" className="glass-card p-6 rounded-3xl hover:bg-white/10 transition group relative flex flex-col items-center justify-center gap-4 aspect-square">
                                    <button onClick={(e) => {e.preventDefault(); deleteBookmark(bm.id);}} className="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition p-2 hover:bg-red-500/20 text-red-400 rounded-full"><Icon name="trash-2" className="w-4 h-4" /></button>
                                    <img src={`https://www.google.com/s2/favicons?domain=${bm.url}&sz=64`} alt={bm.name} className="w-12 h-12 rounded-xl" onError={(e) => {e.target.style.display='none'}} />
                                    <span className="font-medium text-center">{bm.name}</span>
                                </a>
                            ))}
                        </div>
                    </div>
                );
            };

            const SettingsView = () => (
                <div className="fade-in max-w-2xl glass-card p-8 rounded-3xl">
                    <h2 className="text-2xl font-bold mb-8">Paramètres</h2>
                    <div className="space-y-6">
                        <div className="flex justify-between items-center border-b border-white/10 pb-4">
                            <div>
                                <h4 className="font-medium">Thème Sombre</h4>
                                <p className="text-sm text-gray-400">Le thème par défaut du Dashboard</p>
                            </div>
                            <div className="w-12 h-6 bg-[#a8e6cf] rounded-full relative cursor-pointer"><div className="w-4 h-4 bg-black rounded-full absolute right-1 top-1"></div></div>
                        </div>
                        <div className="flex justify-between items-center border-b border-white/10 pb-4">
                            <div>
                                <h4 className="font-medium">Notifications</h4>
                                <p className="text-sm text-gray-400">Activer les rappels de tâches</p>
                            </div>
                            <div className="w-12 h-6 bg-gray-600 rounded-full relative cursor-pointer"><div className="w-4 h-4 bg-white rounded-full absolute left-1 top-1"></div></div>
                        </div>
                        <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full py-3 rounded-xl border border-red-500/50 text-red-400 hover:bg-red-500/10 transition mt-4">
                            Réinitialiser toutes les données
                        </button>
                    </div>
                </div>
            );

            const navItems = [
                { id: 'home', label: 'Dashboard', icon: 'home' },
                { id: 'tasks', label: 'Mes Tâches', icon: 'check-square' },
                { id: 'calendar', label: 'Calendrier', icon: 'calendar' },
                { id: 'notes', label: 'Notes', icon: 'edit-3' },
                { id: 'events', label: 'Événements', icon: 'zap' },
                { id: 'watchlist', label: 'Watchlist', icon: 'film' },
                { id: 'bookmarks', label: 'Favoris', icon: 'bookmark' },
                { id: 'settings', label: 'Paramètres', icon: 'settings' }
            ];

            return (
                <div className="flex h-screen overflow-hidden text-gray-100">
                    <div className="w-64 glass-card p-6 flex flex-col gap-8 hidden md:flex border-r border-gray-800 z-10">
                        <div className="flex items-center gap-3 mt-4 justify-center">
                            <div className="w-10 h-10 bg-white text-black rounded-xl flex items-center justify-center font-bold text-2xl">T°</div>
                            <span className="font-bold text-xl tracking-wider">Dash.</span>
                        </div>
                        <nav className="flex flex-col gap-2 mt-4">
                            {navItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`flex items-center gap-4 px-4 py-3 rounded-xl transition-all w-full text-left
                                        ${activeTab === item.id 
                                            ? 'bg-white/10 text-white font-bold scale-[1.02] border border-white/10' 
                                            : 'text-gray-500 hover:text-white hover:bg-white/5'}`}
                                >
                                    <Icon name={item.icon} className="w-5 h-5" /> {item.label}
                                </button>
                            ))}
                        </nav>
                    </div>

                    <div className="flex-1 p-6 md:p-10 overflow-y-auto relative">
                        <div className="flex justify-between items-center mb-6 md:mb-10 sticky top-0 bg-[#1a1a1a]/90 backdrop-blur-md z-10 py-4 -mt-4 border-b border-white/5 relative">
                            <div className="flex items-center gap-3 min-w-0">
                                <button
                                    onClick={() => setMobileMenuOpen(v => !v)}
                                    aria-label={mobileMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'}
                                    aria-expanded={mobileMenuOpen}
                                    className="md:hidden w-10 h-10 shrink-0 rounded-xl bg-white/10 border border-white/10 text-white flex items-center justify-center hover:bg-white/20 transition"
                                >
                                    <Icon name={mobileMenuOpen ? 'x' : 'menu'} className="w-5 h-5" />
                                </button>
                                <div className="text-2xl sm:text-3xl font-bold capitalize truncate">
                                    {(navItems.find(i => i.id === activeTab) || {}).label}
                                </div>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="hidden sm:flex glass-card px-4 py-2 rounded-full items-center gap-3">
                                    <Icon name="search" className="w-4 h-4 text-gray-400" />
                                    <input type="text" placeholder="Rechercher..." className="bg-transparent border-none outline-none text-sm w-32 md:w-48 placeholder-gray-500" />
                                </div>
                                <div className="w-10 h-10 rounded-full bg-gray-500 border border-gray-400 cursor-pointer overflow-hidden shadow-lg hover:scale-110 transition">
                                   <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar" />
                                </div>
                            </div>
                            {mobileMenuOpen && (
                                <>
                                    <div
                                        className="md:hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-20"
                                        onClick={() => setMobileMenuOpen(false)}
                                    ></div>
                                    <nav className="md:hidden absolute left-0 right-0 top-full mt-2 z-30 rounded-2xl border border-white/10 bg-[#1a1a1a] p-2 shadow-2xl max-h-[65vh] overflow-y-auto">
                                        {navItems.map(item => (
                                            <button
                                                key={item.id}
                                                onClick={() => { setActiveTab(item.id); setMobileMenuOpen(false); }}
                                                className={`flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl transition ${activeTab === item.id ? 'bg-white/10 text-white font-bold border border-white/10' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}
                                            >
                                                <Icon name={item.icon} className="w-5 h-5" /> {item.label}
                                            </button>
                                        ))}
                                    </nav>
                                </>
                            )}
                        </div>

                        {activeTab === 'home' && <HomeView />}
                        {activeTab === 'tasks' && <TasksView />}
                        {activeTab === 'calendar' && <CalendarView />}
                        {activeTab === 'notes' && <NotesView />}
                        {activeTab === 'events' && <EventsView />}
                        {activeTab === 'watchlist' && <WatchlistView />}
                        {activeTab === 'bookmarks' && <BookmarksView />}
                        {activeTab === 'settings' && <SettingsView />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
